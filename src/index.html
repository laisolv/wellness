<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Luma</title>
  <base href="/">

  <!-- viewport-fit=cover é o que faz env(safe-area-inset-*) funcionar no iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark light">

  <!-- Aplica o tema salvo ANTES do Angular carregar, evitando o flash de escuro.
       Usa a mesma chave do ThemeService: 'luma-theme'. -->
  <script>
    try {
      var saved = localStorage.getItem('luma-theme');
      document.documentElement.setAttribute(
        'data-theme',
        saved === 'light' ? 'light' : 'dark'
      );
    } catch (e) {}
  </script>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
