
<nav class="navigation">

  <div class="navigation-brand">
    <a routerLink="/" class="brand-link">
      <h1>LUMA<span>.</span></h1>
    </a>
  </div>

  <div
    class="navigation-links"
    (pointerleave)="restoreGlass()"
    [style.--glass-index]="glassIndex()"
    [style.--glass-stretch]="glassStretch()"
    [style.--glass-origin]="glassOrigin()"
  >

    <span class="glass-indicator" aria-hidden="true"></span>

    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (isActiveChange)="setActive(0, $event)"
      (pointerenter)="moveGlass(0)"
      (focus)="moveGlass(0)"
      aria-label="Início"
    >
      <svg lucideHouse></svg>
      <span>Início</span>
    </a>

    <a
      routerLink="/memories"
      routerLinkActive="active"
      (isActiveChange)="setActive(1, $event)"
      (pointerenter)="moveGlass(1)"
      (focus)="moveGlass(1)"
      aria-label="Memórias"
    >
      <svg lucideImages></svg>
      <span>Memórias</span>
    </a>

    <a
      routerLink="/library"
      routerLinkActive="active"
      (isActiveChange)="setActive(2, $event)"
      (pointerenter)="moveGlass(2)"
      (focus)="moveGlass(2)"
      aria-label="Biblioteca"
    >
      <svg lucideBookOpen></svg>
      <span>Biblioteca</span>
    </a>

    <a
      routerLink="/wellness"
      routerLinkActive="active"
      (isActiveChange)="setActive(3, $event)"
      (pointerenter)="moveGlass(3)"
      (focus)="moveGlass(3)"
      aria-label="Bem-estar"
    >
      <svg lucideHeartPulse></svg>
      <span>Bem-estar</span>
    </a>

    <a
      routerLink="/profile"
      routerLinkActive="active"
      (isActiveChange)="setActive(4, $event)"
      (pointerenter)="moveGlass(4)"
      (focus)="moveGlass(4)"
      aria-label="Perfil"
    >
      <svg lucideUser></svg>
      <span>Perfil</span>
    </a>

    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      (pointerenter)="moveGlass(5)"
      (focus)="moveGlass(5)"
      [attr.aria-label]="isDarkMode ? 'Ativar modo claro' : 'Ativar modo escuro'"
      [attr.title]="isDarkMode ? 'Modo claro' : 'Modo escuro'"
    >
      @if (isDarkMode) {
        <svg lucideSun></svg>
      } @else {
        <svg lucideMoon></svg>
      }
    </button>

  </div>

</nav>
